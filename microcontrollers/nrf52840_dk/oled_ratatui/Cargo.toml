[package]
name = "oled_ratatui"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.5"
defmt = "1.1.0"
defmt-rtt = "1.2.0"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "0.10.0", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embedded-alloc = "0.7.0"
embedded-graphics = "0.8.2"
mousefood = { version = "0.5.0", features = ["fonts"] }
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
ratatui = { version = "0.30.0", default-features = false, features = ["portable-atomic"] }
sh1106 = "0.5.0"
static_cell = "2.1.1"

[profile.release]
debug = 2
lto = true
opt-level = 'z' # Optimize for size

[[bin]]
name = "oled_ratatui"
test = false
bench = false
doctest = false

